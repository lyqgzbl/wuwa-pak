[project]
name = "wuwa-pak"
version = "0.1.0"
description = "Wuthering Waves Pak parser and extractor"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pycryptodome>=3.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.12",
]

[project.scripts]
wuwa-pak = "wuwa_pak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
